# =============================================================================
# Killer Sudoku — Two-Service Compose (App + DB)
#
# Quick start:  docker compose up --build
# Browser:      http://localhost:8080
# DB-Port:      127.0.0.1:1433 (only localhost — sqlcmd / SSMS / DBeaver)
# =============================================================================
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: killersudoku-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set (siehe .env.example)}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - killersudoku-db:/var/opt/mssql
      - ./db/sudoku.sql:/docker-init/sudoku.sql:ro
      - ./scripts/db-init.sh:/docker-init/db-init.sh:ro
    entrypoint: ["/bin/bash", "/docker-init/db-init.sh"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -d sudoku -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/tim-fischer-zh/killer-sudoku:latest
    container_name: killersudoku-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Sudoku: "Server=db,1433;Database=sudoku;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=true"
      DATAPROTECTION_KEYS_DIR: /var/app-data/.dpkeys
    volumes:
      - killersudoku-app:/var/app-data
    restart: unless-stopped

volumes:
  killersudoku-db:
  killersudoku-app:
